openapi: 3.1.0
info:
  title: MoveMe API
  version: 1.0.0
  description: Ride booking, payments, driver operations, issue reporting, and administration.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register a passenger or driver. Driver publishing remains disabled until an admin enables it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password, phone, role]
              properties:
                firstName: { type: string, minLength: 1 }
                lastName: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
                phone: { type: string, minLength: 1 }
                role: { type: string, enum: [passenger, driver] }
      responses:
        "201": { description: Created; returns user and bearer token }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      security: []
      summary: Sign in and receive a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: User and bearer token }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      summary: Get the signed-in account.
      responses:
        "200": { description: Safe user profile }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/change-password:
    put:
      summary: Change the signed-in user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, minLength: 8 }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /vehicle:
    post:
      summary: Add a vehicle to the signed-in driver account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201": { description: Created vehicle }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      summary: Get the signed-in driver's vehicle.
      x-roles: [DRIVER]
      responses:
        "200": { description: Owned vehicle }
        "403": { $ref: "#/components/responses/Forbidden" }
  /driver/get-all-routes:
    get:
      summary: List routes available for publishing departures.
      x-roles: [DRIVER]
      responses:
        "200": { description: Route list }
        "403": { $ref: "#/components/responses/Forbidden" }
  /driver/get-all-departures:
    get:
      summary: List all departures.
      x-roles: [DRIVER]
      responses:
        "200": { description: Departure list }
        "403": { $ref: "#/components/responses/Forbidden" }
  /driver/get-one-departures/{id}:
    get:
      summary: Get a departure by ID.
      x-roles: [DRIVER]
      parameters:
        - $ref: "#/components/parameters/departureId"
      responses:
        "200": { description: Requested departure }
        "404": { $ref: "#/components/responses/NotFound" }
  /driver/publish-departure:
    post:
      summary: Publish an enabled driver's future departure. Fare/duration/capacity are snapshotted.
      x-roles: [DRIVER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routeId, departureTime, mode]
              properties:
                routeId: { type: string }
                departureTime: { type: string, format: date-time }
                mode: { type: string, enum: [SOLO, POOL] }
      responses:
        "201": { description: Departure published }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /driver/get-departure:
    get:
      summary: List the signed-in driver's departures and assigned passenger contact details.
      x-roles: [DRIVER]
      responses:
        "200": { description: Owned departures }
  /driver/cancel-departure:
    post:
      summary: Cancel an unstarted departure, release seats, refund successful payments, and notify passengers.
      x-roles: [DRIVER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departureId]
              properties:
                departureId: { type: string }
      responses:
        "200": { description: Cancellation and affected passenger count }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /driver/update-trip:
    post:
      summary: Update a departure's trip status (NOT_STARTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED).
      x-roles: [DRIVER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departureId, status]
              properties:
                departureId: { type: string }
                status:
                  {
                    type: string,
                    enum:
                      [
                        NOT_STARTED,
                        ARRIVED,
                        IN_PROGRESS,
                        COMPLETED,
                        CANCELLED,
                      ],
                  }
      responses:
        "200": { description: Updated trip state }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /passenger/rides/search:
    post:
      summary: Search departures by origin and/or destination.
      x-roles: [PASSENGER]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                origin: { type: string }
                destination: { type: string }
      responses:
        "200": { description: Matching departures }
        "400": { $ref: "#/components/responses/BadRequest" }
  /passenger/rides/all-routes:
    get:
      summary: List available routes.
      x-roles: [PASSENGER]
      responses:
        "200": { description: Route list }
  /passenger/rides:
    get:
      summary: List the passenger's reservations and ride history.
      x-roles: [PASSENGER]
      responses:
        "200": { description: Passenger-owned reservations }
  /passenger/rides/{rideId}:
    get:
      summary: Get one of the passenger's reservations.
      x-roles: [PASSENGER]
      parameters:
        - $ref: "#/components/parameters/rideId"
      responses:
        "200": { description: Requested reservation }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/rides/create-reservation:
    post:
      summary: Atomically hold one seat for five minutes.
      x-roles: [PASSENGER]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departureId]
              properties:
                departureId: { type: string, format: uuid }
      responses:
        "201": { description: Reservation and pending payment }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /passenger/rides/cancel-reservation/{reservationId}:
    post:
      summary: Cancel a confirmed reservation before scheduled departure and trip start.
      x-roles: [PASSENGER]
      parameters:
        - $ref: "#/components/parameters/reservationId"
      responses:
        "200": { description: Cancellation and refund outcome }
        "409": { $ref: "#/components/responses/Conflict" }
  /payments/{paymentId}/initialize:
    post:
      summary: Initialize a Paystack payment for a reservation.
      x-roles: [PASSENGER]
      parameters:
        - $ref: "#/components/parameters/paymentId"
      responses:
        "200": { description: Paystack authorization details }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payments/verify/{reference}:
    get:
      summary: Verify a Paystack payment by reference.
      x-roles: [PASSENGER]
      parameters:
        - in: path
          name: reference
          required: true
          schema: { type: string }
      responses:
        "200": { description: Payment verification result }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/paystack/webhook:
    post:
      security: []
      summary: Paystack webhook. Authenticity is verified with the x-paystack-signature HMAC header.
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Event accepted }
        "401": { description: Invalid signature }
  /notifications:
    get:
      summary: List notifications belonging to the signed-in user.
      responses:
        "200": { description: User-owned notifications }
  /notifications/{notificationId}/read:
    patch:
      summary: Mark an owned notification as read.
      parameters:
        - $ref: "#/components/parameters/notificationId"
      responses:
        "200": { description: Updated notification }
  /issues:
    get:
      summary: List issues reported by the signed-in user.
      responses:
        "200": { description: Reporter's issue list }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Report an operational issue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "201": { description: Created issue }
        "400": { $ref: "#/components/responses/BadRequest" }
  /issues/{id}:
    get:
      summary: Get an issue reported by the signed-in user.
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200": { description: Requested issue }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/users:
    get:
      summary: List users.
      x-roles: [ADMIN]
      responses:
        "200": { description: User list }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}:
    get:
      summary: Get a user by ID.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200": { description: Requested user }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update a user's name or email.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, minLength: 3 }
                lastName: { type: string, minLength: 3 }
                email: { type: string, format: email }
      responses:
        "200": { description: Updated user }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a user.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200": { description: Deleted user }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/routes:
    get:
      summary: List all routes, including inactive routes.
      x-roles: [ADMIN]
      responses:
        "200": { description: Route list }
    post:
      summary: Create a route with fixed duration and solo/per-seat pooled fares.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteInput" }
      responses:
        "201": { description: Created route }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/routes/{id}:
    get:
      summary: Get a route by ID.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/routeId"
      responses:
        "200": { description: Requested route }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Change route defaults for future departures; existing departures retain snapshots.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/routeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteInput" }
      responses:
        "200": { description: Updated route }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a route.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/routeId"
      responses:
        "200": { description: Deleted route }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/trips:
    get:
      summary: List trips with departure, driver, vehicle, route, and a passengers array of users whose rides are COMPLETED.
      x-roles: [ADMIN]
      responses:
        "200": { description: Trip list }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/trips/{tripId}:
    get:
      summary: Get a trip with its departure, driver, vehicle, route, and rides with payments.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/tripId"
      responses:
        "200": { description: Requested trip }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/issues:
    get:
      summary: List operational issues with reporter identity.
      x-roles: [ADMIN]
      responses:
        "200": { description: Issue list }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create an operational issue on behalf of the signed-in admin.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "201": { description: Created issue }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/issues/{id}:
    get:
      summary: Get an operational issue by ID.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200": { description: Requested issue }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update an issue's handling status.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/issueId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueStatusUpdate" }
      responses:
        "200": { description: Updated issue }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete an operational issue.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200": { description: Deleted issue }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audits:
    get:
      summary: List audit log entries.
      x-roles: [ADMIN]
      responses:
        "200": { description: Audit log entries }
        "500": { description: Audit log retrieval failed }
  /admin/audits/{id}:
    get:
      summary: Get an audit log entry by ID.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/auditId"
      responses:
        "200": { description: Requested audit log entry }
        "500": { description: Audit log retrieval failed }
  /admin/drivers:
    get:
      summary: List driver accounts and their access state.
      x-roles: [ADMIN]
      responses:
        "200": { description: Driver roster }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/drivers/{id}:
    get:
      summary: Get a driver account by ID.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/driverId"
      responses:
        "200": { description: Driver account }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/drivers/{id}/enable:
    post:
      summary: Enable a driver's departure publishing access.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/driverId"
      responses:
        "200": { description: Enabled driver account }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/drivers/{id}/disable:
    post:
      summary: Disable a driver's departure publishing access.
      x-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/driverId"
      responses:
        "200": { description: Disabled driver account }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    routeId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    departureId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    rideId:
      {
        in: path,
        name: rideId,
        required: true,
        schema: { type: string, format: uuid },
      }
    reservationId:
      {
        in: path,
        name: reservationId,
        required: true,
        schema: { type: string, format: uuid },
      }
    paymentId:
      {
        in: path,
        name: paymentId,
        required: true,
        schema: { type: string, format: uuid },
      }
    notificationId:
      {
        in: path,
        name: notificationId,
        required: true,
        schema: { type: string, format: uuid },
      }
    issueId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    auditId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    driverId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    userId:
      {
        in: path,
        name: id,
        required: true,
        schema: { type: string, format: uuid },
      }
    tripId:
      {
        in: path,
        name: tripId,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    RouteInput:
      type: object
      required: [origin, destination, durationMinutes, soloFare, pooledFare]
      properties:
        origin: { type: string, minLength: 3 }
        destination: { type: string, minLength: 3 }
        durationMinutes: { type: integer, minimum: 1 }
        soloFare: { type: number, exclusiveMinimum: 0 }
        pooledFare: { type: number, exclusiveMinimum: 0 }
        isActive: { type: boolean }
    IssueInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
    IssueStatusUpdate:
      type: object
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
    VehicleInput:
      type: object
      required: [registration, make, model, color, seats]
      properties:
        registration: { type: string }
        make: { type: string }
        model: { type: string }
        color: { type: string }
        seats: { type: integer, minimum: 1, maximum: 80 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: array, items: { type: object } }
  responses:
    BadRequest:
      description: Invalid input; response contains message and field errors.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token / credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated user lacks the required role or driver access.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist or is not owned by the signed-in user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Invalid current state, unavailable seat, overlapping interval, or duplicate request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
